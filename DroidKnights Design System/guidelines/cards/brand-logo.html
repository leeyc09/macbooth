<!-- @dsCard group="Brand" viewport="700x340" name="Logo" subtitle="Starfield lockup · transparent · mark · wordmark" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;background:var(--dk-space);font-family:var(--dk-font-body);padding:24px;display:grid;grid-template-columns:auto 1fr;gap:22px 28px;align-items:center}
.lockup{width:260px;height:260px;display:flex;align-items:center;justify-content:center;background:#000;border-radius:20px;overflow:hidden}
.lockup img{width:100%;height:100%;object-fit:cover}
.variants{display:flex;flex-direction:column;gap:16px}
.v{display:flex;align-items:center;gap:16px}
.v .thumb{width:130px;height:56px;display:flex;align-items:center;justify-content:center;background:var(--dk-navy);border:1px solid var(--dk-border);border-radius:12px;flex:none;overflow:hidden}
.v .thumb.mark img{height:44px;filter:var(--dk-glow-mascot)}
.v .thumb img{max-width:118px;max-height:44px;object-fit:contain}
.v .lbl{color:var(--dk-text);font-weight:700;font-size:15px}
.v .lbl span{display:block;color:var(--dk-text-muted);font-family:var(--dk-font-mono);font-size:12px;margin-top:3px}
</style></head><body>
<div class="lockup"><img src="../../assets/logo-lockup-dark.png" alt="DroidKnights 2026 starfield lockup"></div>
<div class="variants">
  <div class="v"><div class="thumb"><img src="../../assets/logo-lockup.png" alt="transparent lockup" style="max-height:50px"></div><div class="lbl">Transparent lockup<span>logo-lockup.png · 어두운 배경 위 오버레이</span></div></div>
  <div class="v"><div class="thumb mark"><img src="../../assets/logo-favicon.png" alt="favicon mark"></div><div class="lbl">Favicon · Profile<span>logo-favicon.png · 파비콘 · SNS 프로필</span></div></div>
  <div class="v"><div class="thumb mark"><img src="../../assets/logo-mark.png" alt="mark"></div><div class="lbl">Mark<span>logo-mark.png · 아바타 · 파비콘</span></div></div>
  <div class="v"><div class="thumb"><img src="../../assets/logo-wordmark.png" alt="wordmark"></div><div class="lbl">Wordmark<span>logo-wordmark.png · 세로 / 가로 조합</span></div></div>
  <div class="v"><div class="thumb" style="background:#000"><img src="../../assets/logo-circle.png" alt="circle badge" style="max-height:50px"></div><div class="lbl">Circle badge<span>logo-circle.png · 원형 · 스티커 / 프로필</span></div></div>
  <div class="v"><div class="thumb" style="background:#000"><img src="../../assets/logo-full.png" alt="black lockup"></div><div class="lbl">Black lockup<span>logo-full.png · 순수 블랙 배경 전용</span></div></div>
</div>
</body></html>
