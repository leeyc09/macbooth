<!-- @dsCard group="Colors" viewport="700x150" name="Brand Core" subtitle="Blue → purple → lavender accent ramp" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;background:var(--dk-space);font-family:var(--dk-font-mono);padding:22px;display:flex;gap:16px}
.sw{flex:1;border-radius:14px;overflow:hidden;border:1px solid var(--dk-border)}
.chip{height:76px}
.meta{padding:10px 12px;background:var(--dk-navy)}
.name{color:var(--dk-text);font-family:var(--dk-font-body);font-weight:700;font-size:14px}
.hex{color:var(--dk-text-muted);font-size:12px;margin-top:3px}
</style></head><body>
<div class="sw"><div class="chip" style="background:var(--dk-blue)"></div><div class="meta"><div class="name">Blue</div><div class="hex">--dk-blue · #2D7BFF</div></div></div>
<div class="sw"><div class="chip" style="background:var(--dk-purple)"></div><div class="meta"><div class="name">Purple</div><div class="hex">--dk-purple · #7B5CFF</div></div></div>
<div class="sw"><div class="chip" style="background:var(--dk-lavender)"></div><div class="meta"><div class="name">Lavender</div><div class="hex">--dk-lavender · #B18CFF</div></div></div>
</body></html>
