<!-- @dsCard group="Colors" viewport="700x160" name="Gradients" subtitle="Headline ramp, brand fill, galaxy radial" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;background:var(--dk-space);font-family:var(--dk-font-mono);padding:22px;display:flex;gap:16px}
.sw{flex:1;border-radius:14px;overflow:hidden;border:1px solid var(--dk-border)}
.chip{height:84px}
.meta{padding:10px 12px;background:var(--dk-navy)}
.name{color:var(--dk-text);font-family:var(--dk-font-body);font-weight:700;font-size:14px}
.hex{color:var(--dk-text-muted);font-size:11px;margin-top:3px}
</style></head><body>
<div class="sw"><div class="chip" style="background:var(--dk-grad)"></div><div class="meta"><div class="name">Headline</div><div class="hex">--dk-grad · 90° blue→lavender</div></div></div>
<div class="sw"><div class="chip" style="background:var(--dk-grad-brand)"></div><div class="meta"><div class="name">Brand Fill</div><div class="hex">--dk-grad-brand · 135° blue→purple</div></div></div>
<div class="sw"><div class="chip" style="background:var(--dk-grad-galaxy)"></div><div class="meta"><div class="name">Galaxy</div><div class="hex">--dk-grad-galaxy · radial</div></div></div>
</body></html>
