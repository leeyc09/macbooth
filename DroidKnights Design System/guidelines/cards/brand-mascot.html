<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;background:var(--dk-space);font-family:var(--dk-font-body);padding:20px 22px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.cell{background:var(--dk-navy);border:1px solid var(--dk-border);border-radius:16px;padding:10px;text-align:center}
.cell img{height:74px;filter:drop-shadow(0 8px 18px rgba(123,92,255,.4))}
.cell .n{color:var(--dk-text-dim);font-family:var(--dk-font-mono);font-size:11px;margin-top:6px}
</style></head><body>
<div class="grid">
<div class="cell"><img src="../../assets/mascot/hero.png"><div class="n">hero</div></div>
<div class="cell"><img src="../../assets/mascot/wave.png"><div class="n">wave</div></div>
<div class="cell"><img src="../../assets/mascot/point.png"><div class="n">point</div></div>
<div class="cell"><img src="../../assets/mascot/cheer.png"><div class="n">cheer</div></div>
<div class="cell"><img src="../../assets/mascot/laptop.png"><div class="n">laptop</div></div>
<div class="cell"><img src="../../assets/mascot/flag.png"><div class="n">flag</div></div>
<div class="cell"><img src="../../assets/mascot/welcome.png"><div class="n">welcome</div></div>
<div class="cell"><img src="../../assets/mascot/fly.png"><div class="n">fly</div></div>
<div class="cell"><img src="../../assets/mascot/portal.png"><div class="n">portal</div></div>
<div class="cell"><img src="../../assets/mascot/back.png"><div class="n">back</div></div>
</div>
</body></html>
