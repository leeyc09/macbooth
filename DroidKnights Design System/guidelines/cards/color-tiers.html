<!-- @dsCard group="Colors" viewport="700x150" name="Sponsor Tiers" subtitle="Metallic tones, kept off the brand ramp" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;background:var(--dk-space);font-family:var(--dk-font-body);padding:22px;display:flex;gap:14px}
.tier{flex:1;background:var(--dk-navy);border:1px solid var(--dk-border);border-radius:16px;padding:16px;display:flex;align-items:center;gap:12px}
.dot{width:34px;height:34px;border-radius:50%;flex:none}
.name{color:var(--dk-text);font-weight:700;font-size:15px}
.hex{color:var(--dk-text-muted);font-family:var(--dk-font-mono);font-size:12px;margin-top:2px}
</style></head><body>
<div class="tier"><span class="dot" style="background:var(--dk-tier-platinum)"></span><div><div class="name">Platinum</div><div class="hex">#C7CFE6</div></div></div>
<div class="tier"><span class="dot" style="background:var(--dk-tier-gold)"></span><div><div class="name">Gold</div><div class="hex">#F0B537</div></div></div>
<div class="tier"><span class="dot" style="background:var(--dk-tier-silver)"></span><div><div class="name">Silver</div><div class="hex">#BAC2D4</div></div></div>
<div class="tier"><span class="dot" style="background:var(--dk-tier-bronze)"></span><div><div class="name">Bronze</div><div class="hex">#C0824F</div></div></div>
</body></html>
