<!-- @dsCard group="Effects" viewport="700x200" name="Glow" subtitle="Brand glow under CTAs, hero, sparkles" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;background:var(--dk-space);font-family:var(--dk-font-mono);padding:30px 22px;display:flex;align-items:center;gap:40px}
.orbs{display:flex;gap:30px}
.orb{width:90px;height:90px;border-radius:50%}
.b{background:var(--dk-blue);box-shadow:var(--dk-glow)}
.p{background:var(--dk-purple);box-shadow:var(--dk-glow)}
.code{color:var(--dk-text-dim);font-size:14px;line-height:1.9}
.code b{color:var(--dk-lavender)}
</style></head><body>
<div class="orbs"><div class="orb b"></div><div class="orb p"></div></div>
<div class="code"><b>--dk-glow</b><br>0 12px 30px rgba(45,123,255,.4)<br>0 24px 60px rgba(123,92,255,.5)</div>
</body></html>
