<!-- @dsCard group="Spacing" viewport="700x210" name="Spacing Scale" subtitle="Slide rhythm — 110 / 90 / 48 / 26" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;background:var(--dk-space);font-family:var(--dk-font-body);padding:24px 22px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:16px}
.bar{height:16px;border-radius:6px;background:var(--dk-grad-brand)}
.val{font-family:var(--dk-font-mono);color:var(--dk-blue);font-size:14px;width:56px}
.desc{color:var(--dk-text-dim);font-size:14px}
</style></head><body>
<div class="row"><span class="val">110</span><span class="bar" style="width:220px"></span><span class="desc">슬라이드 좌우 패딩 · --dk-space-10</span></div>
<div class="row"><span class="val">90</span><span class="bar" style="width:180px"></span><span class="desc">상단 패딩 · --dk-space-9</span></div>
<div class="row"><span class="val">48</span><span class="bar" style="width:96px"></span><span class="desc">제목 → 본문 간격 · --dk-space-7</span></div>
<div class="row"><span class="val">26</span><span class="bar" style="width:52px"></span><span class="desc">리스트 항목 간격 · --dk-space-5</span></div>
</body></html>
