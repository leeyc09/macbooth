<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="Space base, navy cards, light-theme bg" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;background:var(--dk-space);font-family:var(--dk-font-mono);padding:22px;display:flex;gap:16px}
.sw{flex:1;border-radius:14px;overflow:hidden;border:1px solid var(--dk-border)}
.chip{height:76px}
.meta{padding:10px 12px;background:var(--dk-navy)}
.name{color:var(--dk-text);font-family:var(--dk-font-body);font-weight:700;font-size:14px}
.hex{color:var(--dk-text-muted);font-size:12px;margin-top:3px}
</style></head><body>
<div class="sw"><div class="chip" style="background:var(--dk-space)"></div><div class="meta"><div class="name">Space</div><div class="hex">--dk-space · #0B1230</div></div></div>
<div class="sw"><div class="chip" style="background:var(--dk-navy)"></div><div class="meta"><div class="name">Navy</div><div class="hex">--dk-navy · #0E1A3A</div></div></div>
<div class="sw"><div class="chip" style="background:var(--dk-navy-2)"></div><div class="meta"><div class="name">Navy Raised</div><div class="hex">--dk-navy-2 · #16234A</div></div></div>
<div class="sw"><div class="chip" style="background:var(--dk-light-bg)"></div><div class="meta"><div class="name">Light BG</div><div class="hex">--dk-light-bg · #F4F5FB</div></div></div>
</body></html>
