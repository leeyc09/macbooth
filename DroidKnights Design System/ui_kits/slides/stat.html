<!-- @dsCard group="Slides" viewport="1920x1080" name="06 · Stat" subtitle="숫자 강조 — metric cluster" -->
<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="./slide.css">
<style>body{margin:0}
.st .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-top:70px}
.st .cell{background:var(--dk-navy);border:1px solid var(--dk-border);border-radius:var(--dk-radius-card);padding:44px;box-shadow:var(--dk-shadow-card)}
.st .big{font-weight:900;font-size:120px;line-height:1;background:var(--dk-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.st .cap{font-size:28px;color:var(--dk-text-dim);margin-top:16px}</style></head>
<body><div class="dk-stage st">
<div class="dk-stars"></div>
<div class="dk-glow-bg" style="width:800px;height:800px;background:var(--dk-blue);right:-220px;bottom:-260px;opacity:.35"></div>
<div class="dk-content">
  <div class="dk-eyebrow"><svg class="dk-spark" width="26" height="26" viewBox="0 0 100 100"><path d="M50 3C53 33 67 47 97 50C67 53 53 67 50 97C47 67 33 53 3 50C33 47 47 33 50 3Z" fill="#B18CFF"/></svg>BY THE NUMBERS</div>
  <h2 class="dk-title" style="margin-top:22px">커뮤니티가 만든 규모</h2>
  <div class="grid">
    <div class="cell"><div class="big">2,400+</div><div class="cap">누적 참가 개발자</div></div>
    <div class="cell"><div class="big">87%</div><div class="cap">재참가 의향 응답률</div></div>
    <div class="cell"><div class="big">9회</div><div class="cap">2017년부터 이어온 개최</div></div>
  </div>
</div>
<div class="dk-pageno">06</div>
</div></body></html>
